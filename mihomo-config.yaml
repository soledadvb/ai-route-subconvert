rules:
  # 1. 局域网与广告拦截
  - RULE-SET,private,DIRECT
  - RULE-SET,category-ads-all,REJECT

  # 2. 国内 AI 显式直连
  - RULE-SET,category-ai-cn,DIRECT

  # 3. 精细化海外 AI（优先于日常服务与兜底）
  - RULE-SET,openai,🤖 OpenAI
  - RULE-SET,anthropic,🟠 Claude
  - RULE-SET,google-gemini,🔵 Gemini
  - RULE-SET,xai,⚡ Grok & Perplexity
  - RULE-SET,perplexity,⚡ Grok & Perplexity
  - RULE-SET,category-ai-chat-!cn,✨ Other AI

  # 4. 日常流媒体、社交、办公开发与游戏
  - RULE-SET,youtube,📺 YouTube
  - RULE-SET,netflix,🎬 流媒体
  - RULE-SET,spotify,🎵 Spotify
  - RULE-SET,bilibili,DIRECT
  - RULE-SET,telegram,✈️ Telegram
  - RULE-SET,twitter,🐦 社交媒体
  - RULE-SET,google,🔍 Google
  - RULE-SET,github,💻 DevTools
  - RULE-SET,gitlab,💻 DevTools
  - RULE-SET,atlassian,💻 DevTools
  - RULE-SET,onedrive,☁️ Microsoft
  - RULE-SET,microsoft,☁️ Microsoft
  - RULE-SET,icloud,DIRECT
  - RULE-SET,apple,DIRECT

  # 5. 国内与海外域名分流
  - RULE-SET,geolocation-cn,DIRECT
  - RULE-SET,cn,DIRECT
  - RULE-SET,geolocation-!cn,🚀 节点选择

  # 6. IP 规则置底 (统一附带 no-resolve)
  - RULE-SET,private-ip,DIRECT,no-resolve
  - RULE-SET,telegram-ip,✈️ Telegram,no-resolve
  - RULE-SET,google-ip,🔍 Google,no-resolve
  - RULE-SET,cn-ip,DIRECT,no-resolve

  # 7. 最终兜底
  - MATCH,🐟 漏网之鱼
