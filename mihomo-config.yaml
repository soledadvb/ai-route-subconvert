mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

proxy-providers:
  AirportSub:
    type: http
    url: "https://example.com/sub"
    path: ./proxies/airport.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: 🚀 节点选择
    type: select
    use:
      - AirportSub
  - name: 🤖 OpenAI
    type: select
    use:
      - AirportSub
    filter: "^(?!.*(港|HK|Hong|中国|CN|官网|到期|流量)).*$"
  - name: 🟠 Claude
    type: select
    use:
      - AirportSub
    filter: "^(?!.*(港|HK|Hong|中国|CN|官网|到期|流量)).*$"
  - name: 🔵 Gemini
    type: select
    use:
      - AirportSub
    filter: "^(?!.*(港|HK|Hong|中国|CN|官网|到期|流量)).*$"
  - name: ⚡ Grok & Perplexity
    type: select
    use:
      - AirportSub
    filter: "^(?!.*(港|HK|Hong|中国|CN|官网|到期|流量)).*$"
  - name: ✨ Other AI
    type: select
    use:
      - AirportSub
    filter: "^(?!.*(港|HK|Hong|中国|CN|官网|到期|流量)).*$"
  - name: 📺 YouTube
    type: select
    proxies:
      - 🚀 节点选择
    use:
      - AirportSub
  - name: 🎬 流媒体
    type: select
    proxies:
      - 🚀 节点选择
    use:
      - AirportSub
  - name: 🎵 Spotify
    type: select
    proxies:
      - 🚀 节点选择
    use:
      - AirportSub
  - name: ✈️ Telegram
    type: select
    proxies:
      - 🚀 节点选择
    use:
      - AirportSub
  - name: 🐦 社交媒体
    type: select
    proxies:
      - 🚀 节点选择
    use:
      - AirportSub
  - name: 🔍 Google
    type: select
    proxies:
      - 🚀 节点选择
    use:
      - AirportSub
  - name: 💻 DevTools
    type: select
    proxies:
      - 🚀 节点选择
    use:
      - AirportSub
  - name: ☁️ Microsoft
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
    use:
      - AirportSub
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

